# Serves the built client (client/dist) as static files.
#
# Install:
#   sudo cp deploy/nginx/app.swimtryout.feteboard.ai.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/app.swimtryout.feteboard.ai.conf \
#                /etc/nginx/sites-enabled/app.swimtryout.feteboard.ai.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Publish the build there with deploy/deploy-client.sh.

server {
    listen 80;
    server_name app.swimtryout.feteboard.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.swimtryout.feteboard.ai;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/app.swimtryout.feteboard.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.swimtryout.feteboard.ai/privkey.pem;

    root /var/www/swimtryout-app;
    index index.html;

    # SPA fallback — client-side routes such as /tryouts/view/:id are served by
    # index.html, otherwise a refresh on those URLs returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed bundles, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML shell references the hashed bundles — never cache it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
