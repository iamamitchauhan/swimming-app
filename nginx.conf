# Production Nginx config for swimming-app

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.swimtryout.feteboard.ai app.swimtryout.feteboard.ai swimtryout.feteboard.ai www.swimtryout.feteboard.ai;
    return 301 https://$host$request_uri;
}

# API / Server
server {
    listen 443 ssl http2;
    server_name api.swimtryout.feteboard.ai;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/api.swimtryout.feteboard.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.swimtryout.feteboard.ai/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

# Client (Admin/App)
server {
    listen 443 ssl http2;
    server_name app.swimtryout.feteboard.ai;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/app.swimtryout.feteboard.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.swimtryout.feteboard.ai/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

# Landing Page
server {
    listen 443 ssl http2;
    server_name swimtryout.feteboard.ai www.swimtryout.feteboard.ai;

    # SSL certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/swimtryout.feteboard.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/swimtryout.feteboard.ai/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
