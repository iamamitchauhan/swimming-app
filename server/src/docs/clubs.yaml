paths:
  /clubs:
    get:
      tags: [Clubs]
      summary: List all clubs
      description: Returns all clubs in the system. **super_admin only.**
      operationId: listAllClubs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of clubs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          clubs:
                            type: array
                            items: { $ref: '#/components/schemas/Club' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /clubs/pending:
    get:
      tags: [Clubs]
      summary: List clubs pending review
      description: Returns clubs with status `pending_review`. **super_admin only.**
      operationId: listPendingClubs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clubs awaiting approval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          clubs:
                            type: array
                            items: { $ref: '#/components/schemas/Club' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /clubs/my:
    get:
      tags: [Clubs]
      summary: Get own club
      description: Returns the club owned by the authenticated admin. **admin only.**
      operationId: getMyClub
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated admin's club
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          club: { $ref: '#/components/schemas/Club' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}:
    get:
      tags: [Clubs]
      summary: Get club by ID
      description: Returns a single club by its MongoDB ID. **super_admin only.**
      operationId: getClubById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { type: string }
          description: MongoDB ObjectId of the club
          example: 665f1a2b3c4d5e6f7a8b9c0e
      responses:
        '200':
          description: Club found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          club: { $ref: '#/components/schemas/Club' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/approve:
    put:
      tags: [Clubs]
      summary: Approve a club
      description: |
        Approves a club that is in `pending_review` status.
        Sends an approval notification email to the club owner.
        **super_admin only.**
      operationId: approveClub
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { type: string }
          description: MongoDB ObjectId of the club
          example: 665f1a2b3c4d5e6f7a8b9c0e
      responses:
        '200':
          description: Club approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          club: { $ref: '#/components/schemas/Club' }
        '400':
          description: Club is not in pending_review status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                message: 'Club is not pending review (current status: approved).'
                data: null
                error: CLUB_STATUS_INVALID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clubs/{clubId}/reject:
    put:
      tags: [Clubs]
      summary: Reject a club
      description: |
        Rejects a club that is in `pending_review` status with a mandatory
        rejection reason (minimum 10 characters). Notifies the club owner
        by email. **super_admin only.**
      operationId: rejectClub
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { type: string }
          description: MongoDB ObjectId of the club
          example: 665f1a2b3c4d5e6f7a8b9c0e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  example: Incomplete documentation — please resubmit with a valid phone number.
      responses:
        '200':
          description: Club rejected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          club: { $ref: '#/components/schemas/Club' }
        '400':
          description: Club is not in pending_review status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
