paths:
  /clubs:
    get:
      tags: [Clubs]
      summary: List all clubs
      description: Returns all clubs in the system. **super_admin only.**
      operationId: listAllClubs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of clubs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          clubs:
                            type: array
                            items: { $ref: "#/components/schemas/Club" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clubs/pending:
    get:
      tags: [Clubs]
      summary: List clubs pending review
      description: Returns clubs with status `pending_review`. **super_admin only.**
      operationId: listPendingClubs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Clubs awaiting approval
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          clubs:
                            type: array
                            items: { $ref: "#/components/schemas/Club" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clubs/my:
    get:
      tags: [Clubs]
      summary: Get own club
      description: Returns the club owned by the authenticated admin. **admin only.**
      operationId: getMyClub
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated admin's club
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          club: { $ref: "#/components/schemas/Club" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /clubs/{clubId}:
    get:
      tags: [Clubs]
      summary: Get club by ID
      description: Returns a single club by its MongoDB ID. **super_admin only.**
      operationId: getClubById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { type: string }
          description: MongoDB ObjectId of the club
          example: 665f1a2b3c4d5e6f7a8b9c0e
      responses:
        "200":
          description: Club found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          club: { $ref: "#/components/schemas/Club" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /clubs/{clubId}/approve:
    put:
      tags: [Clubs]
      summary: Approve a club
      description: |
        Approves a club that is in `pending_review` status.
        Sends an approval notification email to the club owner.
        **super_admin only.**
      operationId: approveClub
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { type: string }
          description: MongoDB ObjectId of the club
          example: 665f1a2b3c4d5e6f7a8b9c0e
      responses:
        "200":
          description: Club approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          club: { $ref: "#/components/schemas/Club" }
        "400":
          description: Club is not in pending_review status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                success: false
                message: "Club is not pending review (current status: approved)."
                data: null
                error: CLUB_STATUS_INVALID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /clubs/{clubId}/reject:
    put:
      tags: [Clubs]
      summary: Reject a club
      description: |
        Rejects a club that is in `pending_review` status with a mandatory
        rejection reason (minimum 10 characters). Notifies the club owner
        by email. **super_admin only.**
      operationId: rejectClub
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { type: string }
          description: MongoDB ObjectId of the club
          example: 665f1a2b3c4d5e6f7a8b9c0e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  example: Incomplete documentation — please resubmit with a valid phone number.
      responses:
        "200":
          description: Club rejected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          club: { $ref: "#/components/schemas/Club" }
        "400":
          description: Club is not in pending_review status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /clubs/coaches:
    get:
      tags: [Clubs]
      summary: List active club admins and coaches
      description: Returns active administrators and coaches in the authenticated user's club for tryout assignments.
      operationId: listClubCoaches
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Club members available for coach assignments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          coaches:
                            type: array
                            items:
                              type: object
                              required: [_id, email, role, status, firstName, lastName]
                              properties:
                                _id: { type: string }
                                email: { type: string, format: email }
                                role: { type: string, enum: [admin, coach] }
                                status: { type: string }
                                firstName: { type: string }
                                lastName: { type: string }
                                createdAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clubs/state:
    get:
      tags: [Clubs]
      summary: Get club overview stats
      description: |
        Returns aggregate statistics for the authenticated user's club dashboard.

        Counts are computed as follows:
        - **memberCount**: Users with `status: "active"` belonging to the club.
        - **coachCount**: Users with role `coach` and non-suspended status.
        - **tryoutCount**: All tryouts belonging to the club (any status).
        - **activeTryoutCount**: Tryouts with computed status "open" (not draft,
          not completed, not in-progress) — uses date-based computation.
        - **registeredSwimmerCount**: Distinct swimmers with non-cancelled registrations
          across the club's tryouts.
        - **pendingRegistrationCount**: Registrations with status "registered"
          across the club's tryouts.
        - **waitlistCount**: Total waitlist entries across the club's tryouts.

        **admin** and **coach** roles only.
      operationId: getClubState
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Club state retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          club: { $ref: "#/components/schemas/Club" }
                          memberCount:
                            type: integer
                            description: Active users in the club.
                            example: 12
                          coachCount:
                            type: integer
                            description: Non-suspended coaches in the club.
                            example: 3
                          tryoutCount:
                            type: integer
                            description: Total tryouts (all statuses).
                            example: 8
                          activeTryoutCount:
                            type: integer
                            description: Tryouts with computed status "open".
                            example: 2
                          registeredSwimmerCount:
                            type: integer
                            description: Distinct swimmers with non-cancelled registrations.
                            example: 45
                          pendingRegistrationCount:
                            type: integer
                            description: Registrations with status "registered".
                            example: 30
                          waitlistCount:
                            type: integer
                            description: Total waitlist entries across club tryouts.
                            example: 7
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
