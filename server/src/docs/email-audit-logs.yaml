paths:
  /email-audit-logs:
    get:
      tags: [Email Audit Logs]
      summary: List email audit log entries
      description: |
        Returns a paginated, filterable list of email audit log rows.
        Each row represents a single offer/reject email send attempt
        (single decision via `PUT /tryouts/{id}/registrations/{regId}/decision`
        or bulk via `POST /tryouts/{id}/bulk-email`), including the final
        interpolated subject, plain-text body, rendered HTML, send status
        (`sent` or `failed`), error message (if any), and SES messageId
        (if available).

        Access control:
          - `super_admin` may pass any `clubId` filter (or omit it to list across clubs).
          - `admin` and `coach` are automatically scoped to their own `clubId`
            (any `clubId` query param they send is ignored).
      operationId: listEmailAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: clubId
          in: query
          required: false
          description: Filter by club. Ignored for non-super_admin users (auto-scoped).
          schema:
            type: string
        - name: tryoutId
          in: query
          required: false
          description: Filter by tryout
          schema:
            type: string
        - name: registrationId
          in: query
          required: false
          description: Filter by registration
          schema:
            type: string
        - name: senderId
          in: query
          required: false
          description: Filter by the user who triggered the send
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Filter by decision action
          schema:
            type: string
            enum: [offered, rejected]
        - name: status
          in: query
          required: false
          description: Filter by send status
          schema:
            type: string
            enum: [sent, failed]
        - name: mode
          in: query
          required: false
          description: Filter by send mode
          schema:
            type: string
            enum: [single, bulk]
        - name: templateType
          in: query
          required: false
          description: Filter by template type
          schema:
            type: string
            enum: [custom, default]
        - name: recipientEmail
          in: query
          required: false
          description: Substring (case-insensitive) match on recipient email
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: ISO date — only rows with `sentAt` >= this value
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: ISO date — only rows with `sentAt` <= this value
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: Page number (1-based, default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Audit log rows retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/EmailAuditLog"
                          total:
                            type: integer
                            description: Total matching rows across all pages
                            example: 42
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 50
              example:
                success: true
                message: Retrieved
                data:
                  items:
                    - _id: "665f1a2b3c4d5e6f7a8b9c1f"
                      clubId: "665f1a2b3c4d5e6f7a8b9c0e"
                      tryoutId: "665f1a2b3c4d5e6f7a8b9c0f"
                      registrationId: "665f1a2b3c4d5e6f7a8b9c10"
                      recipientEmail: "parent@example.com"
                      swimmerName: "Ansh Shah"
                      parentName: "Pritesh Shah"
                      action: "offered"
                      mode: "single"
                      templateType: "custom"
                      subject: "Team Offer for Ansh Shah"
                      body: "Hi Pritesh Shah, we are pleased to offer Ansh Shah a spot..."
                      html: "<!DOCTYPE html><html>..."
                      status: "sent"
                      messageId: "0101018f7e2b3c4d-..."
                      senderId: "665f1a2b3c4d5e6f7a8b9c0d"
                      senderName: "Coach Sarah"
                      sentAt: "2026-08-17T14:23:11.000Z"
                      createdAt: "2026-08-17T14:23:11.000Z"
                      updatedAt: "2026-08-17T14:23:11.000Z"
                  total: 42
                  page: 1
                  limit: 50
                error: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  schemas:
    EmailAuditLog:
      type: object
      properties:
        _id:
          type: string
          example: "665f1a2b3c4d5e6f7a8b9c1f"
        clubId:
          type: string
          description: Club the email was sent on behalf of
          example: "665f1a2b3c4d5e6f7a8b9c0e"
        tryoutId:
          type: string
          description: Tryout the registration belongs to
          example: "665f1a2b3c4d5e6f7a8b9c0f"
        registrationId:
          type: string
          nullable: true
          description: Registration that triggered the email
          example: "665f1a2b3c4d5e6f7a8b9c10"
        recipientEmail:
          type: string
          format: email
          example: "parent@example.com"
        swimmerName:
          type: string
          nullable: true
          example: "Ansh Shah"
        parentName:
          type: string
          nullable: true
          example: "Pritesh Shah"
        action:
          type: string
          enum: [offered, rejected]
          example: offered
        mode:
          type: string
          enum: [single, bulk]
          description: Whether the email was sent via the single decision endpoint or the bulk endpoint
          example: single
        templateType:
          type: string
          enum: [custom, default]
          description: Whether a saved club template was used or the server's default template
          example: custom
        subject:
          type: string
          description: Final interpolated subject line that was sent
          example: "Team Offer for Ansh Shah"
        body:
          type: string
          description: Final interpolated plain-text body that was sent
          example: "Hi Pritesh Shah, we are pleased to offer Ansh Shah a spot..."
        html:
          type: string
          description: Full rendered HTML payload (output of renderLayout) that was sent
          example: "<!DOCTYPE html><html>..."
        status:
          type: string
          enum: [sent, failed]
          example: sent
        errorMessage:
          type: string
          nullable: true
          description: Error message captured when status is `failed`
          example: null
        messageId:
          type: string
          nullable: true
          description: SES/nodemailer message ID returned for a successful send
          example: "0101018f7e2b3c4d-..."
        senderId:
          type: string
          nullable: true
          description: User who triggered the send
          example: "665f1a2b3c4d5e6f7a8b9c0d"
        senderName:
          type: string
          nullable: true
          example: "Coach Sarah"
        sentAt:
          type: string
          format: date-time
          example: "2026-08-17T14:23:11.000Z"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
