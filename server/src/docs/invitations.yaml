paths:
  /invitations:
    post:
      tags: [Invitations]
      summary: Send an invitation
      description: |
        Sends an invitation email to a new user with the specified role.

        **Role constraints:**
        - `admin` can invite `admin` or `coach`
        - `coach` can only invite `coach`

        The club must be in `approved` status. Duplicate pending invitations
        for the same email+club are rejected.
      operationId: sendInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  example: newcoach@example.com
                role:
                  type: string
                  enum: [admin, coach]
                  example: coach
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invitation: { $ref: '#/components/schemas/Invitation' }
        '400':
          description: Club not approved or other business rule violation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: User already exists or pending invitation already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation
      description: |
        Accepts an invitation using the single-use token from the invitation
        email. Creates the user account and links it to the club. The token
        expires in `INVITATION_EXPIRES_HOURS` hours (default 48 h).

        **No authentication required** — this is a public endpoint.
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, firstName, lastName]
              properties:
                token:
                  type: string
                  minLength: 1
                  description: One-time token from the invitation email
                  example: a3f8c1d2e4b5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
                firstName:
                  type: string
                  minLength: 1
                  example: Alex
                lastName:
                  type: string
                  minLength: 1
                  example: Smith
      responses:
        '201':
          description: Invitation accepted, account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId: { type: string, example: 665f1a2b3c4d5e6f7a8b9c0d }
                          email: { type: string, format: email, example: newcoach@example.com }
                          role: { type: string, example: coach }
                          clubId: { type: string, example: 665f1a2b3c4d5e6f7a8b9c0e }
        '400':
          description: Token invalid, expired, or already used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A user with this email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /invitations/my:
    get:
      tags: [Invitations]
      summary: List my sent invitations
      description: Returns all invitations sent by the authenticated user.
      operationId: listMySentInvitations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitations sent by this user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invitations:
                            type: array
                            items: { $ref: '#/components/schemas/Invitation' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invitations/club/{clubId}:
    get:
      tags: [Invitations]
      summary: List invitations for a club
      description: |
        Returns all invitations for a specific club.
        Admin users can only view invitations for their own club.
        `super_admin` can view any club.
      operationId: listClubInvitations
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { type: string }
          description: MongoDB ObjectId of the club
          example: 665f1a2b3c4d5e6f7a8b9c0e
      responses:
        '200':
          description: Invitations for the club
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invitations:
                            type: array
                            items: { $ref: '#/components/schemas/Invitation' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
