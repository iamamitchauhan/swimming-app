paths:
  /tryouts/public:
    get:
      tags: [Tryouts]
      summary: List all active tryouts (Public)
      description: |
        Returns a paginated list of all active tryouts across all clubs.
        This endpoint is publicly accessible and does not require authentication.
        Parents can use this to discover available tryouts for registration.
      operationId: listPublicTryouts
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of tryouts per page (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          description: Search tryouts by name, description, or location
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          description: Field to sort results by
          required: false
          schema:
            type: string
            enum: [name, createdAt, updatedAt]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort order (asc or desc)
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: List of active tryouts retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TryoutListResult"
              example:
                success: true
                message: Success
                data:
                  tryouts:
                    - _id: "665f1a2b3c4d5e6f7a8b9c11"
                      name: "Summer Swim Team Tryouts 2024"
                      location: "Main Pool - Blue Dolphins Aquatic Center"
                      description: "Join our competitive swim team!"
                      status: "active"
                      theme: "ocean"
                      bannerUrl: "https://cdn.example.com/tryout-banner.jpg"
                      slotDuration: 30
                      swimmersPerSlot: 24
                      lanesAvailable: 6
                      laneDetails:
                        - _id: "665f1a2b3c4d5e6f7a8b9c12"
                          name: "Lane 1"
                          order: 1
                        - _id: "665f1a2b3c4d5e6f7a8b9c13"
                          name: "Lane 2"
                          order: 2
                      swimmersPerLane: 4
                      ctaLabel: "Sign up today"
                      highlights: "Professional coaching staff"
                      sessions:
                        - date: "2024-07-15"
                          startTime: "09:00"
                          endTime: "12:00"
                          label: "Morning Session"
                      segments:
                        - name: "Junior Swimmers"
                          minAge: 6
                          maxAge: 10
                          level: "beginner"
                      clubId: "665f1a2b3c4d5e6f7a8b9c0e"
                      createdAt: "2024-06-15T10:00:00Z"
                      updatedAt: "2024-06-15T10:00:00Z"
                  total: 25
                  page: 1
                  limit: 10
                  totalPages: 3
                error: null
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tryouts:
    get:
      tags: [Tryouts]
      summary: List tryouts for user's club
      description: |
        Returns a paginated list of tryouts for the authenticated user's club.
        Requires admin or coach role. Supports filtering by status, date range, and search.
      operationId: listClubTryouts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of tryouts per page (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          description: Search tryouts by name, description, or location
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filter by tryout status
          required: false
          schema:
            type: string
            enum: [draft, active, closed, cancelled, all]
            default: all
        - name: dateFrom
          in: query
          description: Filter tryouts created from this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Filter tryouts created to this date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: sortBy
          in: query
          description: Field to sort results by
          required: false
          schema:
            type: string
            enum: [name, status, createdAt, updatedAt]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort order (asc or desc)
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: List of tryouts retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TryoutListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      tags: [Tryouts]
      summary: Create a new tryout
      description: |
        Creates a new tryout for the authenticated user's club.
        Requires admin or coach role. Supports multipart/form-data for banner image upload.
      operationId: createTryout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, status]
              properties:
                name:
                  type: string
                  description: Tryout name
                  example: "Summer Swim Team Tryouts 2024"
                location:
                  type: string
                  description: Tryout location
                  example: "Main Pool - Blue Dolphins Aquatic Center"
                description:
                  type: string
                  description: Detailed description of the tryout
                  example: "Join our competitive swim team!"
                theme:
                  type: string
                  enum: [ocean, sunset, forest, city]
                  default: ocean
                  description: Visual theme for the tryout page
                bannerUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: URL to banner image (alternative to file upload)
                banner:
                  type: string
                  format: binary
                  description: Banner image file (max 5MB, image/*)
                slotDuration:
                  type: integer
                  minimum: 15
                  maximum: 120
                  default: 30
                  description: Duration of each registration slot in minutes
                swimmersPerSlot:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 24
                  description: Maximum swimmers per time slot (derived from lanesAvailable * swimmersPerLane)
                lanesAvailable:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 6
                  description: Number of pool lanes available; laneDetails are generated from this value and persisted on the tryout
                swimmersPerLane:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 4
                  description: Maximum swimmers per lane
                ctaLabel:
                  type: string
                  default: "Sign up today"
                  description: Call-to-action button text
                highlights:
                  type: string
                  description: Key highlights (supports newlines)
                  example: "• Professional coaching staff\n• State-of-the-art facility"
                additionalInstructions:
                  type: string
                  nullable: true
                  description: Additional instructions for participants
                status:
                  type: string
                  enum: [draft, active, closed, cancelled]
                  description: Tryout status
                sessions:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      startTime:
                        type: string
                        pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                      endTime:
                        type: string
                        pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                      label:
                        type: string
                  description: Tryout session schedule
                segments:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      minAge:
                        type: integer
                        minimum: 4
                        maximum: 18
                      maxAge:
                        type: integer
                        minimum: 4
                        maximum: 18
                      level:
                        type: string
                        enum: [beginner, intermediate, advanced, elite]
                  description: Age/level segments for registration
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                  description: Registration process steps
                faqs:
                  type: array
                  items:
                    type: object
                    properties:
                      question:
                        type: string
                      answer:
                        type: string
                  description: Frequently asked questions
      responses:
        "201":
          description: Tryout created successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tryout:
                            $ref: "#/components/schemas/Tryout"
              example:
                success: true
                message: Tryout created successfully
                data:
                  tryout:
                    _id: "665f1a2b3c4d5e6f7a8b9c11"
                    name: "Summer Swim Team Tryouts 2024"
                    status: "draft"
                    # ... other tryout fields
                error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tryouts/{id}:
    get:
      tags: [Tryouts]
      summary: Get tryout by ID
      description: |
        Returns a specific tryout by ID. Only accessible by admin/coach users
        from the same club as the tryout.
      operationId: getTryoutById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tryout ID
          schema:
            type: string
      responses:
        "200":
          description: Tryout retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tryout:
                            $ref: "#/components/schemas/Tryout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    put:
      tags: [Tryouts]
      summary: Update tryout
      description: |
        Updates an existing tryout. Requires admin or coach role.
        Supports multipart/form-data for banner image upload.
      operationId: updateTryout
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tryout ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Tryout name
                location:
                  type: string
                  description: Tryout location
                description:
                  type: string
                  description: Detailed description of the tryout
                theme:
                  type: string
                  enum: [ocean, sunset, forest, city]
                  description: Visual theme for the tryout page
                bannerUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: URL to banner image
                banner:
                  type: string
                  format: binary
                  description: Banner image file (max 5MB, image/*)
                slotDuration:
                  type: integer
                  minimum: 15
                  maximum: 120
                  description: Duration of each registration slot in minutes
                swimmersPerSlot:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Maximum swimmers per time slot (derived from lanesAvailable * swimmersPerLane)
                lanesAvailable:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Number of pool lanes available
                swimmersPerLane:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Maximum swimmers per lane
                ctaLabel:
                  type: string
                  description: Call-to-action button text
                highlights:
                  type: string
                  description: Key highlights (supports newlines)
                additionalInstructions:
                  type: string
                  nullable: true
                  description: Additional instructions for participants
                status:
                  type: string
                  enum: [draft, active, closed, cancelled]
                  description: Tryout status
                sessions:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      startTime:
                        type: string
                        pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                      endTime:
                        type: string
                        pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                      label:
                        type: string
                  description: Tryout session schedule
                segments:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      minAge:
                        type: integer
                        minimum: 4
                        maximum: 18
                      maxAge:
                        type: integer
                        minimum: 4
                        maximum: 18
                      level:
                        type: string
                        enum: [beginner, intermediate, advanced, elite]
                  description: Age/level segments for registration
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                  description: Registration process steps
                faqs:
                  type: array
                  items:
                    type: object
                    properties:
                      question:
                        type: string
                      answer:
                        type: string
                  description: Frequently asked questions
      responses:
        "200":
          description: Tryout updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tryout:
                            $ref: "#/components/schemas/Tryout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      tags: [Tryouts]
      summary: Delete tryout
      description: |
        Deletes a tryout. Requires admin or coach role.
        This action is irreversible.
      operationId: deleteTryout
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tryout ID
          schema:
            type: string
      responses:
        "200":
          description: Tryout deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        example: null
              example:
                success: true
                message: Tryout deleted successfully
                data: null
                error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tryouts/{id}/registrations:
    get:
      tags: [Tryouts]
      summary: List tryout registrations
      description: Returns paginated registrations. Use registerIds to fetch selected registrations for bulk scoring.
      operationId: listTryoutRegistrations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: registerIds
          in: query
          required: false
          description: Comma-separated registration IDs to fetch as a selected set.
          schema:
            type: string
          example: 6a5499b323709ced7a116edc,6a5499e523709ced7a116ef9
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Registrations returned successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tryouts/{id}/registrations/{regId}/score:
    put:
      tags: [Tryouts]
      summary: Update swimmer scores
      description: |
        Updates the scores for a specific registration. Supports both the simple
        stroke-level scores (freestyle, backstroke, etc.) and detailed per-criterion
        scores via the `detailed_scores` field.

        The `detailed_scores` object maps criterion IDs to their values:
        - Yes/No criteria: "yes" | "no"
        - Rate 1-5 criteria: integer 1-5
        - Checkbox criteria: boolean

        When `detailed_scores` are provided, `scores.totalScore` is automatically
        computed by summing all numeric values (rate 1-5 scores) in the merged
        `detailed_scores` object. This ensures the swimmer appears in the leaderboard.

        Requires admin or coach role.
      operationId: updateScore
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tryout ID
          schema:
            type: string
        - name: regId
          in: path
          required: true
          description: Registration ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                safety_entry_exit:
                  type: boolean
                  description: Safety entry/exit check
                safety_float:
                  type: boolean
                  description: Safety float check
                freestyle:
                  type: number
                  minimum: 0
                  maximum: 10
                  description: Freestyle score (0-10)
                backstroke:
                  type: number
                  minimum: 0
                  maximum: 10
                  description: Backstroke score (0-10)
                breaststroke:
                  type: number
                  minimum: 0
                  maximum: 10
                  description: Breaststroke score (0-10)
                butterfly:
                  type: number
                  minimum: 0
                  maximum: 10
                  description: Butterfly score (0-10)
                notes:
                  type: string
                  description: Coach notes
                detailed_scores:
                  type: object
                  description: |
                    Map of criterion ID to score value.
                    Yes/No criteria use "yes" or "no".
                    Rate 1-5 criteria use integers 1-5.
                    Checkbox criteria use booleans.
                  additionalProperties:
                    oneOf:
                      - type: string
                        enum: [yes, no]
                      - type: integer
                        minimum: 1
                        maximum: 5
                      - type: boolean
                  example:
                    circle_swim: "yes"
                    hand_entry: "no"
                    legs_straight: 3
                    uw_to_flags: true
                coach_recommendation:
                  type: string
                  enum: [Platinum, Gold, Silver]
                  nullable: true
                  description: Coach's group recommendation for the swimmer
                  example: Gold
            example:
              freestyle: 7
              backstroke: 6
              detailed_scores:
                circle_swim: "yes"
                hand_entry: "no"
                legs_straight: 3
                uw_to_flags: true
      responses:
        "200":
          description: Scores updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          registration:
                            type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tryouts/{id}/leaderboard:
    get:
      tags: [Tryouts]
      summary: Get scored swimmer leaderboard
      description: |
        Returns all scored swimmers for a tryout, sorted by total score (descending).
        A registration is considered "scored" if it has either `scores.totalScore` set
        or a non-empty `detailedScores` object.

        The `total_score` field is computed from `scores.totalScore` if available,
        otherwise it is derived by summing all numeric values in `detailed_scores`.

        Results are grouped by segment on the client side using `segment_name` / `age_segment`.
      operationId: getTryoutLeaderboard
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tryout ID
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            registration_id:
                              type: string
                              example: "665f1a2b3c4d5e6f7a8b9c1a"
                            swimmer_name:
                              type: string
                              example: "Jane Doe"
                            swimmer_age:
                              type: integer
                              example: 8
                            segment_name:
                              type: string
                              example: "Junior Swimmers"
                            age_segment:
                              type: string
                              example: "6-10"
                            total_score:
                              type: number
                              example: 18.5
                            status:
                              type: string
                              enum: [registered, waitlisted, offered, rejected, cancelled]
                              example: registered
                            detailed_scores:
                              type: object
                              additionalProperties:
                                oneOf:
                                  - type: string
                                    enum: [yes, no]
                                  - type: integer
                                    minimum: 1
                                    maximum: 5
                                  - type: boolean
                              example:
                                circle_swim: "yes"
                                hand_entry: "no"
                                legs_straight: 3
                            coach_recommendation:
                              type: string
                              nullable: true
                              description: Coach recommendation group ID assigned to this swimmer.
                              example: "665f1a2b3c4d5e6f7a8b9c2b"
                            coach_recommendation_name:
                              type: string
                              nullable: true
                              description: Resolved group name for the coach recommendation.
                              example: "Advanced Squad"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tryouts/{id}/registrations/{regId}/decision:
    put:
      tags: [Tryouts]
      summary: Offer or reject a swimmer
      description: |
        Updates the registration status to `offered` or `rejected`. After the
        status is saved, the swimmer's parent is emailed using the club's
        saved email template.

        For `offered`, the email template is selected from the swimmer's
        `coachRecommendation` group. For `rejected`, the club-wide rejection
        template is used. If no matching template exists, a default email is
        sent.
      operationId: registrationDecision
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tryout ID
          schema:
            type: string
        - name: regId
          in: path
          required: true
          description: Registration ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [offered, rejected]
                  description: New registration status
            example:
              status: offered
      responses:
        "200":
          description: Status updated and email queued
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          registration:
                            type: object
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tryouts/{id}/bulk-email:
    post:
      tags: [Tryouts]
      summary: Send bulk template email to selected registrations
      description: |
        Sends a templated email to the parents of the selected registrations.
        The following template variables are supported:
        `{{swimmer_name}}`, `{{parent_name}}`, `{{parent_email}}`,
        `{{club_name}}`, `{{tryout_name}}`, `{{group_name}}`.
        `{{group_name}}` is resolved from the registration's `coachRecommendation` field.
      operationId: sendBulkEmail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tryout ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationIds, subject, body, action]
              properties:
                registrationIds:
                  type: array
                  description: IDs of registrations to email
                  items:
                    type: string
                  example: ["665f1a2b3c4d5e6f7a8b9c1a"]
                subject:
                  type: string
                  description: Email subject template
                  example: "Team Offer for {{swimmer_name}}"
                body:
                  type: string
                  description: Email body template
                  example: "Hi {{parent_name}}, we are pleased to offer {{swimmer_name}} a spot in the {{group_name}} group."
                action:
                  type: string
                  enum: [offered, rejected]
                  description: Registration status to apply after sending
                  example: offered
      responses:
        "202":
          description: Bulk email queued successfully
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          queued:
                            type: integer
                            description: Number of recipients queued
                            example: 5
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
