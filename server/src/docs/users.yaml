paths:
  /users/me:
    get:
      tags: [Users]
      summary: Get own profile
      description: Returns the full profile of the currently authenticated user.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user's profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/PublicUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [Users]
      summary: Update own profile
      description: Updates the authenticated user's first and/or last name.
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 1
                  example: Jane
                lastName:
                  type: string
                  minLength: 1
                  example: Doe
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/PublicUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/club/{clubId}:
    get:
      tags: [Users]
      summary: List users in a club
      description: |
        Returns all users belonging to the specified club.
        - `admin` and `coach` can only view their own club's members (club isolation enforced).
        - `super_admin` can view any club.
      operationId: getUsersByClub
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema: { type: string }
          description: MongoDB ObjectId of the club
          example: 665f1a2b3c4d5e6f7a8b9c0e
      responses:
        "200":
          description: Users in the club
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items: { $ref: "#/components/schemas/PublicUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    get:
      tags: [Users]
      summary: List all users
      description: |
        Returns all users in the system. Supports optional query filters.
        **super_admin only.**
      operationId: listAllUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          required: false
          schema:
            type: string
            enum: [super_admin, admin, coach, parent]
          description: Filter by a single role (legacy). Prefer `roles` for multi-select.
          example: coach
        - in: query
          name: roles
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of roles to filter by (multi-select).
            A user matches if their role equals any of the supplied values.
            When omitted, no role filter is applied.
          example: admin,coach
        - in: query
          name: statuses
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of user statuses to filter by (multi-select).
            Allowed values: `active`, `pending_verification`, `suspended`.
            When omitted, suspended users are excluded by default; supplying
            this parameter overrides that default.
          example: active,pending_verification
        - in: query
          name: clubId
          required: false
          schema: { type: string }
          description: Filter by club MongoDB ObjectId
          example: 665f1a2b3c4d5e6f7a8b9c0e
      responses:
        "200":
          description: All users (optionally filtered)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items: { $ref: "#/components/schemas/PublicUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Returns a single user by their MongoDB ID. **super_admin only.**
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
          description: MongoDB ObjectId of the user
          example: 665f1a2b3c4d5e6f7a8b9c0d
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/PublicUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
